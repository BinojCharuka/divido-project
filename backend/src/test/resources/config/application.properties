# Test-only fail-safe. classpath:/config/ outranks classpath:/application.yml, so this
# shadows the ${DB_URL} placeholder for every test. A test that does not import
# TestcontainersConfiguration fails here (".invalid" never resolves) instead of
# connecting to the shared development database.
spring.datasource.url=jdbc:postgresql://must-use-testcontainers.invalid:1/none
