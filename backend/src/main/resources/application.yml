spring:
  application:
    name: divido-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # Keep PostgreSQL "Detail:" text (e.g. the duplicate email) out of exception
        # messages and logs. The primary message still names the violated constraint.
        logServerErrorDetail: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    max-http-form-post-size: 15MB
    max-swallow-size: 15MB
  servlet:
    session:
      # Idle timeout; Tomcat applies it in whole minutes.
      timeout: ${SESSION_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        # The name is not set here: CookieSettings uses __Host-DIVIDO_SESSION when
        # secure is true and DIVIDO_SESSION otherwise. Domain must stay unset.
        path: /
        http-only: true
        # Keep true wherever the API is served over HTTPS. Set false only for local HTTP.
        secure: ${SESSION_COOKIE_SECURE:true}
        # Also applied to the CSRF cookie. "none" requires secure: true.
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

divido:
  cors:
    # Comma-separated exact frontend origins allowed to make credentialed requests,
    # e.g. http://localhost:3000. Empty means no cross-origin access.
    allowed-origins: ${DIVIDO_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    enabled: ${DIVIDO_RATE_LIMIT_ENABLED:true}
    trusted-proxies: ${DIVIDO_RATE_LIMIT_TRUSTED_PROXIES:}
    login:
      limit: ${DIVIDO_RATE_LIMIT_LOGIN_LIMIT:10}
      window: ${DIVIDO_RATE_LIMIT_LOGIN_WINDOW:1m}
    register:
      limit: ${DIVIDO_RATE_LIMIT_REGISTER_LIMIT:10}
      window: ${DIVIDO_RATE_LIMIT_REGISTER_WINDOW:1m}
    password-reset:
      limit: ${DIVIDO_RATE_LIMIT_PASSWORD_RESET_LIMIT:5}
      window: ${DIVIDO_RATE_LIMIT_PASSWORD_RESET_WINDOW:1m}
    password-check:
      limit: ${DIVIDO_RATE_LIMIT_PASSWORD_CHECK_LIMIT:10}
      window: ${DIVIDO_RATE_LIMIT_PASSWORD_CHECK_WINDOW:1m}
  # Password reset email (DEC-045). With mail disabled, no email is sent and a
  # warning without the link is logged. SMTP settings come from SPRING_MAIL_HOST,
  # SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD.
  mail:
    enabled: ${DIVIDO_MAIL_ENABLED:false}
    from: ${DIVIDO_MAIL_FROM:Divido <no-reply@divido.local>}
  app:
    # The frontend origin used in reset links, e.g. https://app.example.com
    public-url: ${DIVIDO_APP_PUBLIC_URL:http://localhost:3000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout: ${GEMINI_TIMEOUT:35s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never