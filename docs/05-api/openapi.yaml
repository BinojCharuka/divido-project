openapi: 3.1.0
info:
  title: Divido API
  version: 1.0.0-proposed
  description: >
    Proposed API contract for Divido. This specification is not frozen.
    Confirm all routes, fields, security, status codes, and schemas against
    approved product decisions and the current Spring Boot implementation.


    Authentication (implemented in DIV-006): a server-side session identified
    by the HttpOnly `__Host-DIVIDO_SESSION` cookie, declared in the global `security`
    section (DEC-015). Only POST /api/v1/auth/login creates the session;
    registration does not sign the user in (DEC-025). HTTP Basic is not
    accepted and no `WWW-Authenticate` challenge is sent.


    CSRF: every POST, PUT, PATCH and DELETE request, including register and
    login, must send the masked token from GET /api/v1/auth/csrf in the
    `X-XSRF-TOKEN` header. The token is read only from that header, never from
    a `_csrf` parameter. The browser sends the HttpOnly `__Host-XSRF-TOKEN`
    cookie set by the same endpoint. A missing or wrong token gets 403
    `CSRF_INVALID`. With local plain-HTTP settings both cookie names drop the
    `__Host-` prefix. Cookie and CSRF
    details are in authentication-api.md (DEC-027, approved). Unknown request
    fields are ignored (DEC-026).
servers:
  - url: http://localhost:8080
    description: Local development proposal; confirm actual port and base URL.
tags:
  - name: Health
  - name: Authentication
  - name: Profile
  - name: Categories
  - name: Income Sources
  - name: Transactions
  - name: Budgets
  - name: Dashboard
  - name: Insights
  - name: Reflections
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Application health
      security: []
      responses:
        '200':
          description: >
            Implemented. Always returns `{"status":"UP"}`; this endpoint does not
            check the database or other dependencies.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [UP]
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register an account (implemented in DIV-005; contract proposed)
      description: >
        Public; no credentials required, and an Authorization header is ignored.
        Requires a CSRF token. Creates the account only: it does not create a
        session or sign the user in (DEC-025, approved). The client should then
        send the user to sign in.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: >
            Account created. `user.email` is the normalized (trimmed, lower-cased)
            email, `displayName` the trimmed name, and `onboardingComplete` is `false`
            (DEC-044). No password, hash or session
            identifier is returned, and no cookie is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: >
            `VALIDATION_ERROR` with `fieldErrors` keyed by `email`, `password` or
            `displayName`; or `MALFORMED_REQUEST` when the body is not readable JSON.
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          $ref: '#/components/responses/RegistrationConflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in (implemented in DIV-006; contract proposed)
      description: >
        Public; requires a CSRF token. The email is normalized exactly as at
        registration (DEC-023). On success the server creates a new session
        (rotating any existing session ID) and clears the pre-login CSRF token,
        so the client must call GET /api/v1/auth/csrf again before its next
        state-changing request.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >
            Signed in. The session ID is only in the HttpOnly cookie, never in the
            body. `displayName` and `onboardingComplete` are read from the database
            (DEC-043, DEC-044).
          headers:
            Set-Cookie:
              description: >
                `__Host-DIVIDO_SESSION=<id>; Path=/; Secure; HttpOnly; SameSite=Lax`,
                plus an expired `__Host-XSRF-TOKEN` cookie when the request carried one.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: >
            `VALIDATION_ERROR` with `fieldErrors` keyed by `email` or `password`;
            or `MALFORMED_REQUEST` when the body is not readable JSON.
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Get current session user (implemented in DIV-006; contract proposed)
      description: >
        The user is taken from the session only; request parameters, headers and
        bodies are never used to identify the user. No CSRF token is needed.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Sign out (implemented in DIV-006; contract proposed)
      description: >
        Requires a session and a CSRF token. Invalidates the server-side session
        and expires the session and CSRF cookies.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Session invalidated. No body.
          headers:
            Set-Cookie:
              description: >
                `__Host-DIVIDO_SESSION=; Path=/; Max-Age=0; Expires=<past>; Secure; HttpOnly; SameSite=Lax`
                and an expired `__Host-XSRF-TOKEN` cookie with the same attributes.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      summary: Get a CSRF token (implemented in DIV-006; contract proposed)
      description: >
        Public. Returns a masked CSRF token and, if the request has no CSRF
        cookie, sets `__Host-XSRF-TOKEN` (`Path=/; Secure; HttpOnly;
        SameSite=Lax`) holding the raw token. The masked value changes on every
        call; each one is valid for the current cookie. Does not create a
        session. Send the token in the `X-XSRF-TOKEN` header on every
        state-changing request.
      security: []
      responses:
        '200':
          description: Current CSRF token. Not cacheable.
          headers:
            Set-Cookie:
              description: '`__Host-XSRF-TOKEN=<raw token>; Path=/; Secure; HttpOnly; SameSite=Lax` when newly issued.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
  /api/v1/auth/password-reset/request:
    post:
      tags: [Authentication]
      summary: Request a password reset link (AUTH-007, implemented in DIV-029; DEC-045)
      description: >
        Public; needs a CSRF token. Always `202` for a valid email, whether or not
        it has an account. For an account, a single-use 30-minute link
        `{public-url}/reset-password#token=<token>` is emailed in the background;
        only the SHA-256 hash of the token is stored and earlier links stop
        working. At most 3 links per email per 10 minutes (silently enforced).
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Accepted. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Authentication]
      summary: Set a new password with a reset link (AUTH-008, implemented in DIV-029; DEC-045)
      description: >
        Public; needs a CSRF token. Consumes the token atomically, stores the new
        password and ends every session of the account.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '204':
          description: Password changed. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
          description: >
            `VALIDATION_ERROR` for the new password, or `PASSWORD_RESET_INVALID`
            when the token is malformed, unknown, expired or already used.
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /api/v1/profile:
    get:
      tags: [Profile]
      summary: Read own profile (PROFILE-001, implemented in DIV-022)
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      summary: Update display name (PROFILE-002, implemented in DIV-022; DEC-043)
      description: Only `displayName` can change; other fields are ignored.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
    delete:
      tags: [Profile]
      summary: Delete own account and all its data (PROFILE-005, implemented in DIV-035; DEC-046)
      description: >
        Needs the password and the word `DELETE`. Deletes everything the account
        owns in one transaction, then signs the session out and expires its cookies.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '204':
          description: Account deleted and signed out. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
          description: >
            `VALIDATION_ERROR` with `fieldErrors.confirmation` or `fieldErrors.password`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /api/v1/profile/onboarding-complete:
    post:
      tags: [Profile]
      summary: Mark onboarding finished or skipped (PROFILE-003, implemented in DIV-023; DEC-044)
      description: Idempotent; later calls change nothing.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Profile with `onboardingComplete` true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
  /api/v1/profile/password:
    post:
      tags: [Profile]
      summary: Change password (PROFILE-004, implemented in DIV-022; DEC-043)
      description: >
        Needs the current password. This session stays signed in under a new
        session ID; every other session of the account ends.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
          description: >
            `VALIDATION_ERROR` with `fieldErrors.currentPassword` or `fieldErrors.newPassword`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /api/v1/categories:
    get:
      tags: [Categories]
      summary: List usable categories
      description: Lists all categories usable by the authenticated user, comprising the 3 shared global defaults (user_id IS NULL) plus the user's custom categories (user_id = auth_user.id) per DEC-013.
      parameters:
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/GroupFilter'
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Create a custom category
      description: Creates a user-owned custom category (user_id = auth_user.id) per DEC-013. Global default categories cannot be created by users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/categories/{categoryId}:
    patch:
      tags: [Categories]
      summary: Update an allowed category field
      description: Updates an allowed custom category field. Global default categories are immutable to users and cannot be updated (DEC-013).
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/categories/{categoryId}/deactivate:
    post:
      tags: [Categories]
      summary: Deactivate a category (optional)
      description: Deactivates a user's custom category. Global default categories cannot be deactivated by users (DEC-013).
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Category deactivated
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/income-sources:
    get:
      tags: [Income Sources]
      summary: List income sources
      parameters:
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Income sources
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/IncomeSource'
    post:
      tags: [Income Sources]
      summary: Create an income source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeSourceCreate'
      responses:
        '201':
          description: Income source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeSource'
  /api/v1/income-sources/{sourceId}:
    patch:
      tags: [Income Sources]
      summary: Update an income source
      parameters:
        - $ref: '#/components/parameters/SourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeSourceUpdate'
      responses:
        '200':
          description: Updated income source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeSource'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/income-sources/{sourceId}/deactivate:
    post:
      tags: [Income Sources]
      summary: Deactivate an income source (optional)
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '204':
          description: Income source deactivated
  /api/v1/transactions:
    get:
      tags: [Transactions]
      summary: List the current user's transactions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: from
          in: query
          description: Inclusive date-only lower bound
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Inclusive date-only upper bound
          schema:
            type: string
            format: date
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: incomeSourceId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paged transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Transactions]
      summary: Create an income or expense entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    get:
      tags: [Transactions]
      summary: Read an owned transaction
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Transactions]
      summary: Update an owned transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdate'
      responses:
        '200':
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Transactions]
      summary: Permanently delete an owned transaction (hard delete per DEC-014)
      description: Permanently deletes the transaction record for the authenticated user. Successful deletion returns 204 No Content. Once deleted, the transaction is no longer retrievable. Users cannot delete another user's transactions.
      responses:
        '204':
          description: Transaction permanently deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/budgets/{month}:
    parameters:
      - name: month
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9]\d{3}-(0[1-9]|1[0-2])$'
    get:
      tags: [Budgets]
      summary: Read the signed-in user's monthly plan (BUDGET-001, DIV-025)
      responses:
        '200':
          description: Monthly plan with derived figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyBudget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No plan for this month (code BUDGET_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags: [Budgets]
      summary: Create or replace the signed-in user's monthly plan (BUDGET-002, DIV-025)
      description: Atomic upsert; always 200 with the stored plan. Over-allocation is reported, never blocked (DEC-012). Last write wins under concurrency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlyBudgetInput'
      responses:
        '200':
          description: Stored monthly plan (created or replaced)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyBudget'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Read the signed-in user's monthly dashboard (DASH-001, DIV-026)
      description: Omitting month uses the current month in the user's timezone (default Asia/Colombo).
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^[1-9]\d{3}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Planned figures beside recorded totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/insights:
    get:
      tags: [Insights]
      summary: Read spending insights for a month (INSIGHT-001, DIV-027)
      description: >
        Computed on request from the signed-in user's records (DEC-031 to DEC-033, DEC-041).
        Omitting month uses the current month in the user's timezone (default Asia/Colombo).
        A month after the current one is rejected.
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^[1-9]\d{3}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Month figures, comparison, trend and observations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/reflections:
    get:
      tags: [Reflections]
      summary: List the signed-in user's reflections without answer text (REFLECTION-003, DIV-028)
      responses:
        '200':
          description: Months with a reflection, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReflectionList'
  /api/v1/reflections/{month}:
    parameters:
      - name: month
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9]\d{3}-(0[1-9]|1[0-2])$'
    get:
      tags: [Reflections]
      summary: Read the signed-in user's reflection for a month (REFLECTION-001, DIV-028)
      responses:
        '200':
          description: Stored reflection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reflection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No reflection for this month (code REFLECTION_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags: [Reflections]
      summary: Create or edit the signed-in user's reflection for a month (REFLECTION-002, DIV-028)
      description: >
        Omit version for the first save; send the version last read to edit (DEC-039).
        Replaces the whole answer set. Blank answers are dropped; an all-blank save or a
        future month is rejected (DEC-040). Answers are at most 2,000 characters (DEC-035).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflectionInput'
      responses:
        '200':
          description: Stored reflection (created or edited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reflection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Stale version, or a first save when one already exists (code REFLECTION_CONFLICT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [Reflections]
      summary: Permanently delete the signed-in user's reflection for a month (REFLECTION-004, DIV-028)
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No reflection for this month (code REFLECTION_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-DIVIDO_SESSION
      description: >
        Server-side session cookie set by POST /api/v1/auth/login. HttpOnly,
        Secure, SameSite=Lax, Path=/, no Domain; idle timeout 30 minutes by
        default. Named `DIVIDO_SESSION` with local plain-HTTP settings.
  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: >
        Masked CSRF token from GET /api/v1/auth/csrf. Required on every POST,
        PUT, PATCH and DELETE request, together with the CSRF cookie the browser
        holds. Only this header is checked; a `_csrf` parameter is ignored.
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IncludeInactive:
      name: includeInactive
      in: query
      schema:
        type: boolean
        default: false
    GroupFilter:
      name: group
      in: query
      schema:
        $ref: '#/components/schemas/KakeiboGroup'
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: >
        No valid session: none was sent, or it expired or was signed out.
        `UNAUTHENTICATED`; no `WWW-Authenticate` header is sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            status: 401
            code: UNAUTHENTICATED
            message: Please sign in to continue.
    InvalidCredentials:
      description: >
        Unknown email and wrong password get the same response, so neither is
        revealed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            status: 401
            code: INVALID_CREDENTIALS
            message: The email or password is incorrect.
    CsrfInvalid:
      description: The CSRF token is missing or does not match the cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            status: 403
            code: CSRF_INVALID
            message: Your request could not be verified. Refresh the page and try again.
    NotFound:
      description: Resource not found or not visible to current user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Domain conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RegistrationConflict:
      description: >
        Registration could not complete because the normalized email is already
        registered. Implemented with a neutral code and message (DEC-022); the
        response never contains the submitted email. The 409 status itself still
        reveals that an account exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            status: 409
            code: REGISTRATION_CONFLICT
            message: We couldn't create an account with these details.
    RateLimitExceeded:
      description: >
        Too many requests from the client IP address on an authentication endpoint
        within the sliding-window time period (DEC-022, DEC-027).
      headers:
        Retry-After:
          description: Minimum number of seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            status: 429
            code: RATE_LIMIT_EXCEEDED
            message: Too many requests. Please try again later.
  schemas:
    ApiError:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: integer
        code:
          type: string
          description: >
            Stable machine-readable code. Known codes are listed in
            api-conventions.md (VALIDATION_ERROR, MALFORMED_REQUEST,
            REGISTRATION_CONFLICT, INVALID_CREDENTIALS, UNAUTHENTICATED,
            CSRF_INVALID, FORBIDDEN).
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
          description: Optional; not emitted yet because no correlation ID exists.
    RegisterRequest:
      type: object
      description: >
        Unknown properties are ignored, not rejected (DEC-026); in particular a
        client-supplied `id` has no effect. Limits apply after normalization.
      additionalProperties: true
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            Trimmed and lower-cased (Locale.ROOT) before validation and storage
            (DEC-023). Must be a valid email address of at most 255 characters.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: >
            8 to 72 characters and also at most 72 bytes when UTF-8 encoded
            (the bcrypt input limit), so some non-ASCII passwords under 72
            characters are rejected. Must not be blank. Never trimmed or altered.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            Required (DEC-021). Trimmed before validation; must not be blank and
            is at most 100 characters after trimming. Must not contain the NUL
            character (U+0000), which the database cannot store.
    LoginRequest:
      type: object
      description: Unknown properties are ignored (DEC-026).
      additionalProperties: true
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            Trimmed and lower-cased (Locale.ROOT) exactly as at registration
            (DEC-023). Must be a valid email address.
        password:
          type: string
          format: password
          description: >
            Must not be blank. Never trimmed. A password over 72 UTF-8 bytes
            cannot match any account and gets the neutral 401.
    CsrfTokenResponse:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          description: Always `X-XSRF-TOKEN`.
        token:
          type: string
          description: >
            Masked token (XOR with fresh random bytes, Base64url). Differs on
            every call and never equals the raw cookie value.
    AuthUser:
      type: object
      required: [id, email, displayName, onboardingComplete]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          maxLength: 100
        onboardingComplete:
          type: boolean
    AuthUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
    Profile:
      type: object
      required: [id, email, displayName, currency, timeZone, locale, onboardingComplete]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Cannot be changed.
        displayName:
          type: string
          maxLength: 100
        currency:
          type: string
          enum: [LKR]
          description: Fixed for the MVP (DEC-043).
        timeZone:
          type: string
          enum: [Asia/Colombo]
          description: Fixed for the MVP (DEC-043).
        locale:
          type: string
          enum: [en]
          description: Fixed for the MVP (DEC-043).
        onboardingComplete:
          type: boolean
    ProfileUpdate:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; must not contain NUL.
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          description: At most 72 UTF-8 bytes; must differ from the current password.
    AccountDeletionRequest:
      type: object
      required: [password, confirmation]
      properties:
        password:
          type: string
        confirmation:
          type: string
          const: DELETE
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    PasswordResetConfirm:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
    KakeiboGroup:
      type: string
      description: >
        Proposed API values. The V1 schema stores `categories.category_type` as
        NEED, WANT, CULTURE or UNEXPECTED (singular). Whether the API maps
        between the two or is aligned with the stored values is OPEN.
      enum: [NEEDS, WANTS, CULTURE, UNEXPECTED]
    Category:
      type: object
      required: [id, name, group, isDefault, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        group:
          $ref: '#/components/schemas/KakeiboGroup'
        isDefault:
          type: boolean
        active:
          type: boolean
    CategoryCreate:
      type: object
      required: [name, group]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        group:
          $ref: '#/components/schemas/KakeiboGroup'
      additionalProperties: false
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        group:
          $ref: '#/components/schemas/KakeiboGroup'
      additionalProperties: false
    IncomeSource:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
    IncomeSourceCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      additionalProperties: false
    IncomeSourceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      additionalProperties: false
    TransactionType:
      type: string
      enum: [INCOME, EXPENSE]
    Transaction:
      type: object
      required: [id, type, amount, date]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        date:
          type: string
          format: date
        category:
          oneOf:
            - $ref: '#/components/schemas/TransactionCategory'
            - type: 'null'
        incomeSource:
          oneOf:
            - $ref: '#/components/schemas/IncomeSourceRef'
            - type: 'null'
        description:
          type: [string, 'null']
        paymentMethod:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TransactionCategory:
      type: object
      required: [id, name, group]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        group:
          $ref: '#/components/schemas/KakeiboGroup'
    IncomeSourceRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    TransactionCreate:
      type: object
      description: >
        Unknown properties are ignored, not rejected (DEC-026); in particular
        client-supplied `id`, `userId`, and `createdAt` have no effect.
      additionalProperties: true
      required: [type, amount, date]
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        date:
          type: string
          format: date
        categoryId:
          type: string
          format: uuid
          description: Required for EXPENSE; must reference an active category accessible to the authenticated user (one of the 3 global defaults or user custom category per DEC-013). Unused for INCOME.
        incomeSourceId:
          type: string
          format: uuid
          description: Optional for INCOME per DEC-003. If provided, backend validates ownership by the authenticated user. Unused for EXPENSE.
        description:
          type: string
          maxLength: 500
        paymentMethod:
          type: string
    TransactionUpdate:
      type: object
      description: >
        Unknown properties are ignored, not rejected (DEC-026).
        Transaction `type` is immutable on update and not an accepted field;
        if supplied, it is treated as an unknown property and ignored.
      additionalProperties: true
      properties:
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        date:
          type: string
          format: date
        categoryId:
          type: string
          format: uuid
          description: Optional for EXPENSE update; if changed, must reference an active category accessible to the authenticated user (DEC-013). Unused for INCOME.
        incomeSourceId:
          type: string
          format: uuid
          description: Optional for INCOME update (DEC-003). If changed, backend validates ownership by the authenticated user. Unused for EXPENSE.
        description:
          type: string
          maxLength: 500
        paymentMethod:
          type: string
    TransactionPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    Money:
      type: string
      description: Exact decimal string with two places (DEC-028), e.g. "40000.00". Negative only where documented.
      pattern: '^-?\d+\.\d{2}$'
    MoneyInput:
      type: string
      description: Zero or positive, at most 2 decimal places, at most 9999999999.99.
      pattern: '^\d+(\.\d{1,2})?$'
    BudgetAllocations:
      type: object
      required: [NEEDS, WANTS, CULTURE, UNEXPECTED]
      properties:
        NEEDS: { $ref: '#/components/schemas/Money' }
        WANTS: { $ref: '#/components/schemas/Money' }
        CULTURE: { $ref: '#/components/schemas/Money' }
        UNEXPECTED: { $ref: '#/components/schemas/Money' }
    MonthlyBudget:
      type: object
      required: [month, plannedIncome, savingsTarget, allocations, allocationTotal, plannedTotal, overAllocationAmount, overAllocated, createdAt, updatedAt]
      properties:
        month:
          type: string
          pattern: '^[1-9]\d{3}-(0[1-9]|1[0-2])$'
        plannedIncome: { $ref: '#/components/schemas/Money' }
        savingsTarget: { $ref: '#/components/schemas/Money' }
        allocations: { $ref: '#/components/schemas/BudgetAllocations' }
        allocationTotal: { $ref: '#/components/schemas/Money' }
        plannedTotal:
          $ref: '#/components/schemas/Money'
        overAllocationAmount:
          description: plannedTotal - plannedIncome; positive means over-allocated, negative means not yet planned
          allOf: [{ $ref: '#/components/schemas/Money' }]
        overAllocated:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MonthlyBudgetInput:
      type: object
      required: [plannedIncome, savingsTarget, allocations]
      description: Unknown top-level fields are ignored (DEC-026); allocations must contain exactly the four group keys.
      properties:
        plannedIncome: { $ref: '#/components/schemas/MoneyInput' }
        savingsTarget: { $ref: '#/components/schemas/MoneyInput' }
        allocations:
          type: object
          required: [NEEDS, WANTS, CULTURE, UNEXPECTED]
          additionalProperties: false
          properties:
            NEEDS: { $ref: '#/components/schemas/MoneyInput' }
            WANTS: { $ref: '#/components/schemas/MoneyInput' }
            CULTURE: { $ref: '#/components/schemas/MoneyInput' }
            UNEXPECTED: { $ref: '#/components/schemas/MoneyInput' }
    DashboardGroup:
      type: object
      required: [group, budget, spent, remaining, percentUsed, overBudget, expenseCount]
      properties:
        group:
          $ref: '#/components/schemas/KakeiboGroup'
        budget:
          type: [string, 'null']
          description: Planned allocation; null without a budget
        spent:
          $ref: '#/components/schemas/Money'
        remaining:
          type: [string, 'null']
          description: budget - spent, may be negative; null without a budget
        percentUsed:
          type: [string, 'null']
          description: spent / budget * 100, one decimal, HALF_UP; null without a budget or when budget is 0.00
        overBudget:
          type: [boolean, 'null']
        expenseCount:
          type: integer
    Dashboard:
      type: object
      required: [month, periodStart, periodEnd, hasBudget, plannedIncome, savingsTarget, allocationTotal, plannedTotal, overAllocationAmount, overAllocated, recordedIncome, incomeTransactionCount, totalSpent, expenseTransactionCount, groups]
      properties:
        month:
          type: string
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        hasBudget:
          type: boolean
        plannedIncome:
          type: [string, 'null']
        savingsTarget:
          type: [string, 'null']
        allocationTotal:
          type: [string, 'null']
        plannedTotal:
          type: [string, 'null']
        overAllocationAmount:
          type: [string, 'null']
        overAllocated:
          type: [boolean, 'null']
        recordedIncome:
          $ref: '#/components/schemas/Money'
        incomeTransactionCount:
          type: integer
        totalSpent:
          $ref: '#/components/schemas/Money'
        expenseTransactionCount:
          type: integer
        groups:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/DashboardGroup'
    Percent:
      type: string
      nullable: true
      pattern: '^-?\d+\.\d$'
      description: One decimal place, HALF_UP; null when the base is zero (DEC-041)
    InsightsResponse:
      type: object
      required: [month, periodStart, periodEnd, asOf, partialMonth, minimumSpendingDays, spendingDays,
                 insufficientHistory, totalSpent, groups, comparison, trend, lookbackStart, lookbackEnd, observations]
      properties:
        month:
          type: string
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        asOf:
          type: string
          format: date
          description: The earlier of today (user timezone) and periodEnd
        partialMonth:
          type: boolean
        minimumSpendingDays:
          type: integer
          example: 3
        spendingDays:
          type: integer
        insufficientHistory:
          type: boolean
        totalSpent:
          $ref: '#/components/schemas/Money'
        groups:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [group, spent, sharePercent, expenseCount]
            properties:
              group:
                $ref: '#/components/schemas/KakeiboGroup'
              spent:
                $ref: '#/components/schemas/Money'
              sharePercent:
                $ref: '#/components/schemas/Percent'
              expenseCount:
                type: integer
        comparison:
          type: object
          required: [currentStart, currentEnd, previousStart, previousEnd, currentSpent, previousSpent,
                     changePercent, currentSpendingDays, previousSpendingDays, groups]
          properties:
            currentStart:
              type: string
              format: date
            currentEnd:
              type: string
              format: date
            previousStart:
              type: string
              format: date
            previousEnd:
              type: string
              format: date
            currentSpent:
              $ref: '#/components/schemas/Money'
            previousSpent:
              $ref: '#/components/schemas/Money'
            changePercent:
              $ref: '#/components/schemas/Percent'
            currentSpendingDays:
              type: integer
            previousSpendingDays:
              type: integer
            groups:
              type: array
              items:
                type: object
                required: [group, currentSpent, previousSpent, changePercent]
                properties:
                  group:
                    $ref: '#/components/schemas/KakeiboGroup'
                  currentSpent:
                    $ref: '#/components/schemas/Money'
                  previousSpent:
                    $ref: '#/components/schemas/Money'
                  changePercent:
                    $ref: '#/components/schemas/Percent'
        trend:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            required: [month, totalSpent, hasActivity, partial]
            properties:
              month:
                type: string
              totalSpent:
                type: string
                nullable: true
                description: null before the user's first transaction
              hasActivity:
                type: boolean
              partial:
                type: boolean
        lookbackStart:
          type: string
          format: date
        lookbackEnd:
          type: string
          format: date
        observations:
          type: array
          items:
            $ref: '#/components/schemas/InsightObservation'
    InsightObservation:
      type: object
      required: [type]
      description: Fields present depend on type (see insights-api.md). Facts only; the UI renders the wording.
      properties:
        type:
          type: string
          enum: [LARGEST_GROUP, GROUP_OVER_PLAN, MONTH_CHANGE, REPEATED_CATEGORY]
        group:
          $ref: '#/components/schemas/KakeiboGroup'
        spent:
          $ref: '#/components/schemas/Money'
        sharePercent:
          type: string
        spendingDays:
          type: integer
        budget:
          $ref: '#/components/schemas/Money'
        overBy:
          $ref: '#/components/schemas/Money'
        currentSpent:
          $ref: '#/components/schemas/Money'
        previousSpent:
          $ref: '#/components/schemas/Money'
        changePercent:
          $ref: '#/components/schemas/Percent'
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        distinctDays:
          type: integer
        transactionCount:
          type: integer
        dates:
          type: array
          items:
            type: string
            format: date
    Reflection:
      type: object
      required: [month, questionSetVersion, version, answers, createdAt, updatedAt]
      properties:
        month:
          type: string
        questionSetVersion:
          type: integer
          example: 1
        version:
          type: integer
          minimum: 1
          description: Send back on the next save (DEC-039)
        answers:
          type: array
          items:
            $ref: '#/components/schemas/ReflectionAnswer'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReflectionAnswer:
      type: object
      required: [questionId, answer]
      properties:
        questionId:
          type: string
          enum: [what-went-well, what-felt-difficult, what-to-change]
        answer:
          type: string
          maxLength: 2000
          description: At most 2,000 characters (Unicode code points) after trimming (DEC-035)
    ReflectionInput:
      type: object
      required: [answers]
      properties:
        version:
          type: integer
          minimum: 1
          description: Omit for the first save of a month
        answers:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/ReflectionAnswer'
    ReflectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [month, answeredCount, updatedAt]
            properties:
              month:
                type: string
              answeredCount:
                type: integer
              updatedAt:
                type: string
                format: date-time
security:
  - sessionCookie: []
