openapi: 3.1.0
info:
  title: Divido API
  version: 1.0.0-proposed
  description: >
    Proposed API contract for Divido. This specification is not frozen.
    Confirm all routes, fields, security, status codes, and schemas against
    approved product decisions and the current Spring Boot implementation.


    Authentication (implemented in DIV-006): a server-side session identified
    by the HttpOnly `__Host-DIVIDO_SESSION` cookie, declared in the global `security`
    section (DEC-015). Only POST /api/v1/auth/login creates the session;
    registration does not sign the user in (DEC-025). HTTP Basic is not
    accepted and no `WWW-Authenticate` challenge is sent.


    CSRF: every POST, PUT, PATCH and DELETE request, including register and
    login, must send the masked token from GET /api/v1/auth/csrf in the
    `X-XSRF-TOKEN` header. The token is read only from that header, never from
    a `_csrf` parameter. The browser sends the HttpOnly `__Host-XSRF-TOKEN`
    cookie set by the same endpoint. A missing or wrong token gets 403
    `CSRF_INVALID`. With local plain-HTTP settings both cookie names drop the
    `__Host-` prefix. Cookie and CSRF
    details are in authentication-api.md (DEC-027, approved). Unknown request
    fields are ignored (DEC-026).
servers:
  - url: http://localhost:8080
    description: Local development proposal; confirm actual port and base URL.
tags:
  - name: Health
  - name: Authentication
  - name: Profile
  - name: Categories
  - name: Income Sources
  - name: Transactions
  - name: Budgets
  - name: Dashboard
  - name: Insights
  - name: Reflections
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Application health
      security: []
      responses:
        '200':
          description: >
            Implemented. Always returns `{"status":"UP"}`; this endpoint does not
            check the database or other dependencies.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [UP]
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register an account (implemented in DIV-005; contract proposed)
      description: >
        Public; no credentials required, and an Authorization header is ignored.
        Requires a CSRF token. Creates the account only: it does not create a
        session or sign the user in (DEC-025, approved). The client should then
        send the user to sign in.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: >
            Account created. `user.email` is the normalized (trimmed, lower-cased)
            email and `onboardingComplete` is `false`. No password, hash or session
            identifier is returned, and no cookie is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: >
            `VALIDATION_ERROR` with `fieldErrors` keyed by `email`, `password` or
            `displayName`; or `MALFORMED_REQUEST` when the body is not readable JSON.
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          $ref: '#/components/responses/RegistrationConflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in (implemented in DIV-006; contract proposed)
      description: >
        Public; requires a CSRF token. The email is normalized exactly as at
        registration (DEC-023). On success the server creates a new session
        (rotating any existing session ID) and clears the pre-login CSRF token,
        so the client must call GET /api/v1/auth/csrf again before its next
        state-changing request.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >
            Signed in. The session ID is only in the HttpOnly cookie, never in the
            body. `onboardingComplete` is always `false` until onboarding exists.
          headers:
            Set-Cookie:
              description: >
                `__Host-DIVIDO_SESSION=<id>; Path=/; Secure; HttpOnly; SameSite=Lax`,
                plus an expired `__Host-XSRF-TOKEN` cookie when the request carried one.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: >
            `VALIDATION_ERROR` with `fieldErrors` keyed by `email` or `password`;
            or `MALFORMED_REQUEST` when the body is not readable JSON.
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Get current session user (implemented in DIV-006; contract proposed)
      description: >
        The user is taken from the session only; request parameters, headers and
        bodies are never used to identify the user. No CSRF token is needed.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Sign out (implemented in DIV-006; contract proposed)
      description: >
        Requires a session and a CSRF token. Invalidates the server-side session
        and expires the session and CSRF cookies.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Session invalidated. No body.
          headers:
            Set-Cookie:
              description: >
                `__Host-DIVIDO_SESSION=; Path=/; Max-Age=0; Expires=<past>; Secure; HttpOnly; SameSite=Lax`
                and an expired `__Host-XSRF-TOKEN` cookie with the same attributes.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      summary: Get a CSRF token (implemented in DIV-006; contract proposed)
      description: >
        Public. Returns a masked CSRF token and, if the request has no CSRF
        cookie, sets `__Host-XSRF-TOKEN` (`Path=/; Secure; HttpOnly;
        SameSite=Lax`) holding the raw token. The masked value changes on every
        call; each one is valid for the current cookie. Does not create a
        session. Send the token in the `X-XSRF-TOKEN` header on every
        state-changing request.
      security: []
      responses:
        '200':
          description: Current CSRF token. Not cacheable.
          headers:
            Set-Cookie:
              description: '`__Host-XSRF-TOKEN=<raw token>; Path=/; Secure; HttpOnly; SameSite=Lax` when newly issued.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
  /api/v1/profile:
    get:
      tags: [Profile]
      summary: Read current profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
    patch:
      tags: [Profile]
      summary: Update current profile/preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/categories:
    get:
      tags: [Categories]
      summary: List usable categories
      description: Lists all categories usable by the authenticated user, comprising the 3 shared global defaults (user_id IS NULL) plus the user's custom categories (user_id = auth_user.id) per DEC-013.
      parameters:
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/GroupFilter'
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Create a custom category
      description: Creates a user-owned custom category (user_id = auth_user.id) per DEC-013. Global default categories cannot be created by users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/categories/{categoryId}:
    patch:
      tags: [Categories]
      summary: Update an allowed category field
      description: Updates an allowed custom category field. Global default categories are immutable to users and cannot be updated (DEC-013).
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/categories/{categoryId}/deactivate:
    post:
      tags: [Categories]
      summary: Deactivate a category (optional)
      description: Deactivates a user's custom category. Global default categories cannot be deactivated by users (DEC-013).
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Category deactivated
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/income-sources:
    get:
      tags: [Income Sources]
      summary: List income sources
      parameters:
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Income sources
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/IncomeSource'
    post:
      tags: [Income Sources]
      summary: Create an income source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeSourceCreate'
      responses:
        '201':
          description: Income source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeSource'
  /api/v1/income-sources/{sourceId}:
    patch:
      tags: [Income Sources]
      summary: Update an income source
      parameters:
        - $ref: '#/components/parameters/SourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeSourceUpdate'
      responses:
        '200':
          description: Updated income source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeSource'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/income-sources/{sourceId}/deactivate:
    post:
      tags: [Income Sources]
      summary: Deactivate an income source (optional)
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '204':
          description: Income source deactivated
  /api/v1/transactions:
    get:
      tags: [Transactions]
      summary: List the current user's transactions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: from
          in: query
          description: Inclusive date-only lower bound
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Inclusive date-only upper bound
          schema:
            type: string
            format: date
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: incomeSourceId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paged transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Transactions]
      summary: Create an income or expense entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    get:
      tags: [Transactions]
      summary: Read an owned transaction
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Transactions]
      summary: Update an owned transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdate'
      responses:
        '200':
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Transactions]
      summary: Permanently delete an owned transaction (hard delete per DEC-014)
      description: Permanently deletes the transaction record for the authenticated user. Successful deletion returns 204 No Content. Once deleted, the transaction is no longer retrievable. Users cannot delete another user's transactions.
      responses:
        '204':
          description: Transaction permanently deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/budgets/{month}:
    parameters:
      - name: month
        in: path
        required: true
        schema:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    get:
      tags: [Budgets]
      summary: Read a monthly plan
      responses:
        '200':
          description: Monthly plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyBudget'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Budgets]
      summary: Create or replace a monthly plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlyBudgetInput'
      responses:
        '200':
          description: Stored monthly plan (upsert status must be finalized)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyBudget'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Read monthly dashboard
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
  /api/v1/insights:
    get:
      tags: [Insights]
      summary: List approved spending insights (if included in MVP)
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Insights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsResponse'
  /api/v1/reflections/{month}:
    parameters:
      - name: month
        in: path
        required: true
        schema:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    get:
      tags: [Reflections]
      summary: Read a monthly reflection (if included in MVP)
      responses:
        '200':
          description: Reflection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reflection'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Reflections]
      summary: Create or update a monthly reflection (if included in MVP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflectionInput'
      responses:
        '200':
          description: Saved reflection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reflection'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-DIVIDO_SESSION
      description: >
        Server-side session cookie set by POST /api/v1/auth/login. HttpOnly,
        Secure, SameSite=Lax, Path=/, no Domain; idle timeout 30 minutes by
        default. Named `DIVIDO_SESSION` with local plain-HTTP settings.
  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: >
        Masked CSRF token from GET /api/v1/auth/csrf. Required on every POST,
        PUT, PATCH and DELETE request, together with the CSRF cookie the browser
        holds. Only this header is checked; a `_csrf` parameter is ignored.
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IncludeInactive:
      name: includeInactive
      in: query
      schema:
        type: boolean
        default: false
    GroupFilter:
      name: group
      in: query
      schema:
        $ref: '#/components/schemas/KakeiboGroup'
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: >
        No valid session: none was sent, or it expired or was signed out.
        `UNAUTHENTICATED`; no `WWW-Authenticate` header is sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            status: 401
            code: UNAUTHENTICATED
            message: Please sign in to continue.
    InvalidCredentials:
      description: >
        Unknown email and wrong password get the same response, so neither is
        revealed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            status: 401
            code: INVALID_CREDENTIALS
            message: The email or password is incorrect.
    CsrfInvalid:
      description: The CSRF token is missing or does not match the cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            status: 403
            code: CSRF_INVALID
            message: Your request could not be verified. Refresh the page and try again.
    NotFound:
      description: Resource not found or not visible to current user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Domain conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RegistrationConflict:
      description: >
        Registration could not complete because the normalized email is already
        registered. Implemented with a neutral code and message (DEC-022); the
        response never contains the submitted email. The 409 status itself still
        reveals that an account exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            status: 409
            code: REGISTRATION_CONFLICT
            message: We couldn't create an account with these details.
    RateLimitExceeded:
      description: >
        Too many requests from the client IP address on an authentication endpoint
        within the sliding-window time period (DEC-022, DEC-027).
      headers:
        Retry-After:
          description: Minimum number of seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            status: 429
            code: RATE_LIMIT_EXCEEDED
            message: Too many requests. Please try again later.
  schemas:
    ApiError:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: integer
        code:
          type: string
          description: >
            Stable machine-readable code. Known codes are listed in
            api-conventions.md (VALIDATION_ERROR, MALFORMED_REQUEST,
            REGISTRATION_CONFLICT, INVALID_CREDENTIALS, UNAUTHENTICATED,
            CSRF_INVALID, FORBIDDEN).
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
          description: Optional; not emitted yet because no correlation ID exists.
    RegisterRequest:
      type: object
      description: >
        Unknown properties are ignored, not rejected (DEC-026); in particular a
        client-supplied `id` has no effect. Limits apply after normalization.
      additionalProperties: true
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            Trimmed and lower-cased (Locale.ROOT) before validation and storage
            (DEC-023). Must be a valid email address of at most 255 characters.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: >
            8 to 72 characters and also at most 72 bytes when UTF-8 encoded
            (the bcrypt input limit), so some non-ASCII passwords under 72
            characters are rejected. Must not be blank. Never trimmed or altered.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            Required (DEC-021). Trimmed before validation; must not be blank and
            is at most 100 characters after trimming. Must not contain the NUL
            character (U+0000), which the database cannot store.
    LoginRequest:
      type: object
      description: Unknown properties are ignored (DEC-026).
      additionalProperties: true
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            Trimmed and lower-cased (Locale.ROOT) exactly as at registration
            (DEC-023). Must be a valid email address.
        password:
          type: string
          format: password
          description: >
            Must not be blank. Never trimmed. A password over 72 UTF-8 bytes
            cannot match any account and gets the neutral 401.
    CsrfTokenResponse:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          description: Always `X-XSRF-TOKEN`.
        token:
          type: string
          description: >
            Masked token (XOR with fresh random bytes, Base64url). Differs on
            every call and never equals the raw cookie value.
    AuthUser:
      type: object
      required: [id, email, onboardingComplete]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        onboardingComplete:
          type: boolean
    AuthUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          description: >
            Set at registration (DEC-021); the V1 `display_name` column is NOT NULL.
        locale:
          type: string
          default: en
        currency:
          type: string
          default: LKR
        timeZone:
          type: string
          default: Asia/Colombo
        onboardingComplete:
          type: boolean
    ProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
        locale:
          type: string
        currency:
          type: string
        timeZone:
          type: string
      additionalProperties: false
    KakeiboGroup:
      type: string
      description: >
        Proposed API values. The V1 schema stores `categories.category_type` as
        NEED, WANT, CULTURE or UNEXPECTED (singular). Whether the API maps
        between the two or is aligned with the stored values is OPEN.
      enum: [NEEDS, WANTS, CULTURE, UNEXPECTED]
    Category:
      type: object
      required: [id, name, group, isDefault, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        group:
          $ref: '#/components/schemas/KakeiboGroup'
        isDefault:
          type: boolean
        active:
          type: boolean
    CategoryCreate:
      type: object
      required: [name, group]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        group:
          $ref: '#/components/schemas/KakeiboGroup'
      additionalProperties: false
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        group:
          $ref: '#/components/schemas/KakeiboGroup'
      additionalProperties: false
    IncomeSource:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
    IncomeSourceCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      additionalProperties: false
    IncomeSourceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      additionalProperties: false
    TransactionType:
      type: string
      enum: [INCOME, EXPENSE]
    Transaction:
      type: object
      required: [id, type, amount, date]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        date:
          type: string
          format: date
        category:
          oneOf:
            - $ref: '#/components/schemas/TransactionCategory'
            - type: 'null'
        incomeSource:
          oneOf:
            - $ref: '#/components/schemas/IncomeSourceRef'
            - type: 'null'
        description:
          type: [string, 'null']
        paymentMethod:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TransactionCategory:
      type: object
      required: [id, name, group]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        group:
          $ref: '#/components/schemas/KakeiboGroup'
    IncomeSourceRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    TransactionCreate:
      type: object
      description: >
        Unknown properties are ignored, not rejected (DEC-026); in particular
        client-supplied `id`, `userId`, and `createdAt` have no effect.
      additionalProperties: true
      required: [type, amount, date]
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        date:
          type: string
          format: date
        categoryId:
          type: string
          format: uuid
          description: Required for EXPENSE; must reference an active category accessible to the authenticated user (one of the 3 global defaults or user custom category per DEC-013). Unused for INCOME.
        incomeSourceId:
          type: string
          format: uuid
          description: Optional for INCOME per DEC-003. If provided, backend validates ownership by the authenticated user. Unused for EXPENSE.
        description:
          type: string
          maxLength: 500
        paymentMethod:
          type: string
    TransactionUpdate:
      type: object
      description: >
        Unknown properties are ignored, not rejected (DEC-026).
        Transaction `type` is immutable on update and not an accepted field;
        if supplied, it is treated as an unknown property and ignored.
      additionalProperties: true
      properties:
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        date:
          type: string
          format: date
        categoryId:
          type: string
          format: uuid
          description: Optional for EXPENSE update; if changed, must reference an active category accessible to the authenticated user (DEC-013). Unused for INCOME.
        incomeSourceId:
          type: string
          format: uuid
          description: Optional for INCOME update (DEC-003). If changed, backend validates ownership by the authenticated user. Unused for EXPENSE.
        description:
          type: string
          maxLength: 500
        paymentMethod:
          type: string
    TransactionPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    MonthlyBudget:
      type: object
      required: [month, plannedIncome, savingsTarget, allocations]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        plannedIncome:
          type: string
        savingsTarget:
          type: string
        allocations:
          type: object
          required: [NEEDS, WANTS, CULTURE, UNEXPECTED]
          properties:
            NEEDS:
              type: string
            WANTS:
              type: string
            CULTURE:
              type: string
            UNEXPECTED:
              type: string
        allocationTotal:
          type: string
        plannedTotal:
          type: string
        overAllocationAmount:
          type: string
    MonthlyBudgetInput:
      type: object
      required: [plannedIncome, savingsTarget, allocations]
      properties:
        plannedIncome:
          type: string
        savingsTarget:
          type: string
        allocations:
          type: object
          required: [NEEDS, WANTS, CULTURE, UNEXPECTED]
          properties:
            NEEDS:
              type: string
            WANTS:
              type: string
            CULTURE:
              type: string
            UNEXPECTED:
              type: string
      additionalProperties: false
    Dashboard:
      type: object
      required: [month]
      properties:
        month:
          type: string
        plannedIncome:
          type: [string, 'null']
        recordedIncome:
          type: string
        savingsTarget:
          type: [string, 'null']
        groups:
          type: array
          items:
            type: object
            required: [group, budget, spent, remaining]
            properties:
              group:
                $ref: '#/components/schemas/KakeiboGroup'
              budget:
                type: [string, 'null']
              spent:
                type: string
              remaining:
                type: [string, 'null']
        recentTransactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        insightPreview:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
    InsightsResponse:
      type: object
      required: [from, to, items, insufficientHistory]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        items:
          type: array
          items:
            type: object
            required: [id, type, title, description]
            properties:
              id:
                type: string
              type:
                type: string
              title:
                type: string
              description:
                type: string
              group:
                $ref: '#/components/schemas/KakeiboGroup'
              evidence:
                type: object
                additionalProperties: true
        insufficientHistory:
          type: boolean
    Reflection:
      type: object
      required: [month, answers]
      properties:
        month:
          type: string
        answers:
          type: array
          items:
            $ref: '#/components/schemas/ReflectionAnswer'
        updatedAt:
          type: string
          format: date-time
    ReflectionAnswer:
      type: object
      required: [questionId, answer]
      properties:
        questionId:
          type: string
        answer:
          type: string
          maxLength: 5000
    ReflectionInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/ReflectionAnswer'
      additionalProperties: false
security:
  - sessionCookie: []
